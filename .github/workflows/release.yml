name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pygame anthropic python-dotenv wonderwords pyinstaller

      - name: Build executable
        run: >
          pyinstaller
          --onefile
          --windowed
          --name "AIDND"
          --collect-data wonderwords
          main.py

      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AIDND.exe
          generate_release_notes: true
